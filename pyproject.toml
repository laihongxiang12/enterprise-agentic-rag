[project]
name = "enterprise-agentic-rag"
version = "0.1.0"
description = "Secure, testable enterprise Agentic RAG service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "langgraph==1.2.16",
    "openai==3.35.0",
    "psycopg[binary]>=3.2,<4",
    "pymilvus==2.5.18",
    "pyjwt>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "pypdf>=6.1,<7",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.14,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "reportlab>=4.4,<5",
    "ruff>=0.9,<1",
    "types-reportlab>=4.4,<5",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
    "integration: requires an explicitly configured external service",
]
pythonpath = ["."]
testpaths = ["tests"]
